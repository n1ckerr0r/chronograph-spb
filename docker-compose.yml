# Имена и пароли потом нужно будет заменить
# Нужно дописать сервим для фронта
# также нужно дописать health чеки
services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: chronograph
      POSTGRES_USER: chronograph
      POSTGRES_PASSWORD: chronograph
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronograph -d chronograph"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_ADDR: :8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: chronograph
      DB_PASSWORD: chronograph
      DB_NAME: chronograph
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./backend/api/openapi.yaml:/openapi.yaml:ro
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
